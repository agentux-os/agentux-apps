<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentUX Office · organization editor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AGENTUX / OFFICE / EDITOR</p>
          <h1><span id="organization-name">Organization</span> <span class="muted">· definition</span></h1>
          <p class="subtle"><span id="version">loading</span> · <span id="mode"></span> · <a href="/">back to the floor</a></p>
        </div>
        <div class="toolbar">
          <button id="new-draft" type="button">New draft</button>
          <button id="save" type="button" disabled>Save</button>
          <button id="publish" type="button" disabled>Publish</button>
        </div>
      </header>
      <p class="subtle publish-note" id="publish-note"></p>
      <p id="state-banner" class="state-banner" role="status" aria-live="polite" hidden></p>

      <div class="editor-layout">
        <div id="sections" class="editor-sections"></div>
        <aside class="editor-side">
          <section><h2>Problems</h2><ul id="problems" class="plain" aria-live="polite"></ul></section>
          <section><h2>Changes from the published version</h2><ul id="changes" class="plain changes"></ul></section>
          <section>
            <h2>Review</h2>
            <ul id="reviews" class="plain"></ul>
            <label class="block">Comment<textarea id="review-comment" rows="2"></textarea></label>
            <div class="toolbar"><button id="approve" type="button" disabled>Approve</button><button id="request-changes" type="button" disabled>Request changes</button></div>
            <p class="subtle" id="review-note"></p>
          </section>
          <section><h2>History</h2><ul id="history" class="plain"></ul></section>
        </aside>
      </div>
    </main>
    <dialog id="publish-dialog" class="modal" aria-labelledby="publish-title"></dialog>
    <script src="/config.js"></script>
    <script type="module" src="/editor.js"></script>
  </body>
</html>
